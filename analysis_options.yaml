include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

formatter:
  page_width: 100

linter:
  rules:
    prefer_single_quotes: true # siempre comillas simples
    directives_ordering: true # imports ordenados alfabéticamente
    sort_constructors_first: true # constructor antes que propiedades y métodos
    prefer_const_constructors: true # const en los widgets que no cambian
